name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install real media test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Windows media test tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Run engineering gate
        run: pnpm check

      - name: Diagnose Windows native test failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm exec vitest run apps/desktop/tests/extensions.test.ts --reporter verbose
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -like '*node.exe*' } |
            Select-Object TimeCreated, Id, Message | Format-List

      - name: Build Desktop
        run: pnpm desktop:build

      - name: Check committed diff formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE" HEAD
          fi
