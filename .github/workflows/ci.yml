name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: pnpm --filter @agent-desktop/desktop exec playwright install --with-deps chromium

      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        run: pnpm --filter @agent-desktop/desktop exec playwright install chromium

      - name: Install real media test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Windows media test tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 使用插件已有的资源锁；Chocolatey 的元数据 504 曾返回成功却未安装任何程序。
          $mediaLock = Get-Content apps/desktop/resources/plugins/ffmpeg/runtime.lock.json -Raw | ConvertFrom-Json
          $mediaRoot = Join-Path $env:RUNNER_TEMP 'agent-desktop-media'
          New-Item -ItemType Directory -Path $mediaRoot | Out-Null
          $mediaArchive = Join-Path $mediaRoot 'ffmpeg.zip'
          Invoke-WebRequest -Uri $mediaLock.url -OutFile $mediaArchive
          if ((Get-FileHash -LiteralPath $mediaArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $mediaLock.sha256) { throw 'FFmpeg archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $mediaArchive -DestinationPath $mediaRoot
          $mediaBin = Join-Path (Join-Path $mediaRoot $mediaLock.archiveRoot) 'bin'
          foreach ($mediaName in @('ffmpeg', 'ffprobe')) {
            $mediaExecutable = Join-Path $mediaBin "$mediaName.exe"
            if ((Get-FileHash -LiteralPath $mediaExecutable -Algorithm SHA256).Hash.ToLowerInvariant() -ne $mediaLock.executables.$mediaName) { throw "$mediaName executable SHA-256 mismatch." }
            & $mediaExecutable -version
            if ($LASTEXITCODE -ne 0) { throw "$mediaName version check failed." }
          }
          $mediaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run engineering gate
        env:
          # Windows 并行运行时观测到多组超时；保留原时限并顺序运行全部测试。
          VITEST_MAX_WORKERS: ${{ runner.os == 'Windows' && '1' || '' }}
        run: pnpm check

      - name: Build Desktop
        run: pnpm desktop:build

      - name: Check committed diff formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE" HEAD
          fi
